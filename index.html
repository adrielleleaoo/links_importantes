<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adrielle Leão | Links Oficiais</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #1b0f36 0%, #0d061b 100%);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Container Principal */
    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    /* Header & Avatar com Anel Neon */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 25px;
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #ff5500, #ff9900, #3b0ca1);
      margin-bottom: 15px;
      box-shadow: 0 0 25px rgba(167, 139, 250, 0.3);
      animation: floatAvatar 4s ease-in-out infinite;
    }

    @keyframes floatAvatar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    header img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #111;
    }

    header h1 {
      font-size: 1.5em;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      background: linear-gradient(to right, #fff, #d8b4fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      font-size: 0.9em;
      opacity: 0.7;
      font-weight: 500;
    }

    /* Botões Padrão (Glassmorphism) */
    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 12px 0;
      padding: 16px 20px;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      font-size: 1.05em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      text-decoration: none;
    }

    .btn i {
      position: absolute;
      left: 20px;
      font-size: 1.25em;
    }

    .btn:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    .btn:active {
      transform: translateY(1px);
    }

    /* BOTÃO DESTAQUE SUPREMO (CURSO) COM CORREÇÃO DE MARGEM PARA O BADGE */
    .btn-curso {
      background: linear-gradient(135deg, #ff5500 0%, #ff8800 100%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(255, 85, 0, 0.4);
      animation: pulseCurso 2.5s infinite;
      overflow: visible; /* Garante que o badge não seja cortado caso encoste nas bordas */
      margin-top: 22px;  /* Espaço extra em cima para acomodar o selo sem cortar */
    }

    .btn-curso::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(60deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: rotate(45deg);
      animation: shine 4s linear infinite;
    }

    @keyframes shine {
      0% { transform: translateX(-100%) rotate(45deg); }
      20% { transform: translateX(100%) rotate(45deg); }
      100% { transform: translateX(100%) rotate(45deg); }
    }

    @keyframes pulseCurso {
      0% { transform: scale(1); box-shadow: 0 10px 30px rgba(255, 85, 0, 0.4); }
      50% { transform: scale(1.02); box-shadow: 0 15px 45px rgba(255, 85, 0, 0.6); }
      100% { transform: scale(1); box-shadow: 0 10px 30px rgba(255, 85, 0, 0.4); }
    }

    .btn-curso:hover {
      background: linear-gradient(135deg, #ff6611, #ffa222);
      transform: translateY(-4px) scale(1.02);
    }

    .badge {
      position: absolute;
      top: -12px; /* Posicionado perfeitamente na bordinha superior sem sumir */
      right: 20px;
      background: #ffffff;
      color: #ff5500;
      font-size: 0.7em;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      z-index: 5;
    }

    /* Popup */
    .popup {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(13, 6, 27, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      box-sizing: border-box;
    }

    .popup-content {
      background: #20133c;
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 25px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      text-align: left;
      animation: modalPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .popup-content h2 {
      margin-top: 0;
      font-size: 1.3em;
      color: #d8b4fe;
      margin-bottom: 12px;
    }

    .popup-content p {
      font-size: 0.95em;
      opacity: 0.85;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .popup-content img {
      width: 100%;
      border-radius: 12px;
      margin: 10px 0;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .popup .btn-popup-action {
      background: #7c3aed;
      color: #fff;
      margin-top: 15px;
    }

    .close {
      float: right;
      font-size: 1.5em;
      cursor: pointer;
      color: #d8b4fe;
      transition: 0.2s;
    }

    .close:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="avatar-wrapper">
        <img src="src/logo.png" alt="Logo Adrielle Leão">
      </div>
      <h1>Adrielle Leão</h1>
      <p>Conteúdos, rotina e métodos práticos</p>
    </header>

    <main style="width: 100%;">
      <!-- BOTÃO DESTAQUE SUPREMO (CURSO) -->
      <button class="btn btn-curso" onclick="window.open('https://ocodigodos15minutos.lovable.app/','_blank')">
        <span class="badge">Vagas Abertas</span>
        <i class="fa-solid fa-fire"></i> O Código dos 15 Minutos
      </button>

      <button class="btn" onclick="openPopup()">
        <i class="fab fa-whatsapp" style="color: #25d366;"></i> Nosso grupo no WhatsApp
      </button>

      <button class="btn" onclick="window.open('https://youtube.com/@adrielleleaoo','_blank')">
        <i class="fab fa-youtube" style="color: #ff0000;"></i> YouTube
      </button>

      <button class="btn" onclick="window.open('https://www.instagram.com/adrielle.leaoo','_blank')">
        <i class="fab fa-instagram" style="color: #e1306c;"></i> Instagram
      </button>

      <button class="btn" onclick="window.open('https://www.tiktok.com/coin','_blank')">
        <i class="fab fa-tiktok" style="color: #ff0050;"></i> Diamantes com 25% OFF
      </button>

      <button class="btn" onclick="window.open('https://nubank.com.br/pagar/3n0qq/izFmgTCQDU','_blank')">
        <i class="fa-brands fa-pix" style="color: #32bcad;"></i> Me apoie pelo PIX
      </button>
    </main>
  </div>

  <!-- POPUP -->
  <div class="popup" id="popup">
    <div class="popup-content">
      <span class="close" onclick="closePopup()">&times;</span>
      <h2>Como entrar no grupo</h2>
      <p>O link de convite não funciona no navegador do TikTok. Para entrar, siga o passo a passo rápido:</p>

      <p><b>1.</b> Toque nos três pontinhos na parte superior:</p>
      <img src="src/passo1.png" alt="Passo 1">

      <p><b>2.</b> Depois toque em <b>Abrir no navegador</b>:</p>
      <img src="src/passo2.png" alt="Passo 2">

      <button class="btn btn-popup-action" id="grupo" onclick="continuar()">Entrar no grupo</button>
    </div>
  </div>

  <script>
    function openPopup() {
      if(estaNoTikTok())
        window.location.href = "page_popup.html";
      else
        window.open("https://chat.whatsapp.com/D2tpEFLtGcL91WWT6eDC2N", "_blank");
    }

    function closePopup() {
      document.getElementById('popup').style.display = 'none';
      history.replaceState(null, '', window.location.pathname);
    }

    function estaNoTikTok() {
      const regex = /musical_ly|bytedance/i; 
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      return regex.test(ua);
    }

    window.addEventListener('load', () => {
      const params = new URLSearchParams(window.location.search);
      if (location.hash === "#popup") {
        openPopup();
      }
    });
  </script>

</body>
</html>
